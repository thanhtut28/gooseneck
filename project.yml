name: PostureDesk
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.posturedesk
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  PostureDesk:
    type: application
    platform: macOS
    sources:
      - path: PostureDesk
      - path: Shared
      - path: PostureSensorDaemon
        excludes:
          - main.swift
          - XPCServer.swift
          - Info.plist
          - PostureSensorDaemon.entitlements
    frameworks:
      - sdk: IOKit.framework
      - sdk: Accelerate.framework
    settings:
      base:
        INFOPLIST_FILE: PostureDesk/Info.plist
        CODE_SIGN_ENTITLEMENTS: PostureDesk/PostureDesk.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.posturedesk.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: PostureSensorDaemon
        embed: false
    postBuildScripts:
      - name: Copy Helper Tool and LaunchDaemon Plist
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Library/HelperTools"
          mkdir -p "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Library/LaunchDaemons"
          cp "${BUILT_PRODUCTS_DIR}/PostureSensorDaemon" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Library/HelperTools/"
          cp "${SRCROOT}/LaunchDaemons/com.posturedesk.sensor-daemon.plist" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Library/LaunchDaemons/"
        outputFiles: []

  PostureSensorDaemon:
    type: tool
    platform: macOS
    sources:
      - path: PostureSensorDaemon
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: PostureSensorDaemon/Info.plist
        CODE_SIGN_ENTITLEMENTS: PostureSensorDaemon/PostureSensorDaemon.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.posturedesk.sensor-daemon
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    frameworks:
      - sdk: IOKit.framework
      - sdk: Accelerate.framework
