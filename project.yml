name: GooseNeck
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.gooseneck
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  GooseNeck:
    type: application
    platform: macOS
    sources:
      - path: PostureDesk
      - path: Shared
      - path: PostureSensorDaemon
    frameworks:
      - sdk: IOKit.framework
      - sdk: Accelerate.framework
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        INFOPLIST_FILE: PostureDesk/Info.plist
        CODE_SIGN_ENTITLEMENTS: PostureDesk/PostureDesk.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gooseneck.app
        MARKETING_VERSION: "1.0.15"
        CURRENT_PROJECT_VERSION: "16"
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          POLAR_API_BASE_URL: "https://sandbox-api.polar.sh/v1/customer-portal/license-keys"
          POLAR_CHECKOUT_URL: "https://sandbox-api.polar.sh/v1/checkout-links/polar_cl_DOGu45YJUcHzeFxGZw5EqT0L9gN3L9Qm2dTQn2Z4xHn/redirect"
          POLAR_ORGANIZATION_ID: "322cca40-cd2e-4d58-83e9-ec08ee2b0c19"
          POLAR_TRIAL_CHECKOUT_URL: "https://sandbox-api.polar.sh/v1/checkout-links/polar_cl_TRIAL_SANDBOX_PLACEHOLDER/redirect"
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
          POLAR_API_BASE_URL: "https://api.polar.sh/v1/customer-portal/license-keys"
          POLAR_CHECKOUT_URL: "https://buy.polar.sh/polar_cl_GZsKqlm3DUSh31ibWoVHnKOdpmyuCHYQoBceU2zgywh"
          POLAR_ORGANIZATION_ID: "8e1ae0f6-a16b-474c-9a19-7efb724334ff"
          POLAR_TRIAL_CHECKOUT_URL: "https://buy.polar.sh/polar_cl_Q7ysBw9NnZf9EFJJSKIXGKGoQubSNznKqOsz70fWfHS"
  GooseNeckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PostureDeskTests
    dependencies:
      - target: GooseNeck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gooseneck.tests
